<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>batcave</title>

    <!--
      Exactly two preloads: the prose variable face and the one mono weight that
      appears above the fold. Everything else loads on demand. `crossorigin` is
      required even same-origin — a font request is CORS-mode, and without it the
      preload is discarded and fetched a second time.
    -->
    <link
      rel="preload"
      href="/fonts/InstrumentSans-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/IBMPlexMono-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      /*
       * Theme before first paint. Inline and synchronous on purpose: deferring
       * this to React would paint the default theme first and flash.
       */
      (function () {
        try {
          var stored = localStorage.getItem('batcave.theme');
          var theme =
            stored === 'night' || stored === 'day'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'day'
                : 'night';
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = 'night';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
